name: Build CI

on:
  push:
  pull_request:

jobs:
  code-quality:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install code quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: Check code formatting (clang-format)
        run: make format-check

      - name: Static analysis (cppcheck)
        run: make lint

  build-and-test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm xorriso mtools dosfstools grub-pc-bin grub-common qemu-system-x86

      - name: Run host-side unit tests
        run: make test HOST_CC=${{ matrix.compiler }}

      - name: Build kernel
        run: |
          make clean
          make CC=${{ matrix.compiler }}

      - name: Headless QEMU boot test
        run: |
          # Runs QEMU for 2 seconds. Exit code 124 (timeout) means the kernel stayed alive without crashing:
          EXIT_CODE=0
          timeout 2s qemu-system-x86_64 -kernel build/kernel32.bin -display none || EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 124 ]; then
            echo "QEMU failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "QEMU boot test passed successfully!"

      - name: Build bootable ISO
        run: make iso

      - name: Upload bootable ISO artifact
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: x86-64-kernel-iso
          path: build/kernel.iso
