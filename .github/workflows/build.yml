name: Build CI

on:
  push:
  pull_request:

jobs:
  code-quality:
    name: Code Quality & Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install code quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: Check code formatting
        run: make format-check

      - name: Static analysis
        run: make lint

  build-and-test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc clang \
            nasm xorriso mtools dosfstools \
            grub-pc-bin grub-common \
            qemu-system-x86

      - name: Build regular kernel ISO
        run: make BUILD_DIR=build-smoke iso CC=${{ matrix.compiler }}

      - name: Boot kernel in QEMU (headless)
        shell: bash
        run: |
          status=0
          timeout --signal=TERM --kill-after=5s 10s \
            qemu-system-x86_64 \
              -cdrom build-smoke/kernel.iso \
              -display none \
              -serial none \
              -monitor none \
              -no-reboot \
              -d int,cpu_reset \
              -D build-smoke/qemu.log || status=$?

          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "::error::QEMU exited unexpectedly (exit code: $status)"
            tail -40 build-smoke/qemu.log
            exit 1
          fi

          echo "Kernel remained running for 10 seconds or shut down cleanly."


      - name: Run host and kernel tests
        run: make test CC=${{ matrix.compiler }} HOST_CC=${{ matrix.compiler }}

      - name: Upload bootable ISO artifact
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: x86-64-kernel-test-iso
          path: build-test/kernel.iso
          if-no-files-found: error
